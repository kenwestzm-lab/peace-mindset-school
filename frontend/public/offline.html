<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peace Mindset - Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #111B21; color: #E9EDEF;
    font-family: 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; text-align: center;
  }
  .logo { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg,#9B1826,#C02035); display:flex; align-items:center; justify-content:center; font-size:40px; margin: 0 auto 20px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #D4AF37; }
  p { font-size: 14px; color: #8696A0; line-height: 1.6; margin-bottom: 24px; }
  button { padding: 14px 32px; background: linear-gradient(135deg,#9B1826,#C02035); border: none; border-radius: 24px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #E53935; display: inline-block; margin: 0 2px; animation: bounce 1.4s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
</style>
</head>
<body>
  <div class="logo">🕊</div>
  <h1>Peace Mindset School</h1>
  <div style="margin-bottom:16px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <p>You're offline. Check your internet connection.<br>Your messages will sync when you're back online.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
